<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Migrate From GitBook or mkdocs in One Command">
	<defs>
		<linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#00FF78"/>
			<stop offset="100%" stop-color="#00DBFF"/>
		</linearGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#g5)"/>
	<circle cx="1080" cy="90" r="170" fill="#ffffff" opacity="0.10"/>
	<circle cx="1150" cy="520" r="110" fill="#0B2B22" opacity="0.06"/>

	<text x="80" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0B2B22" opacity="0.75" letter-spacing="2">BX SITES &#183; MIGRATION</text>

	<text x="76" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="#0B2B22">
		<tspan x="76" dy="0">Migrate From GitBook</tspan>
		<tspan x="76" dy="70">or mkdocs</tspan>
	</text>

	<g transform="translate(80,340)">
		<rect x="0" y="0" width="430" height="56" rx="10" fill="#0B2B22" opacity="0.14"/>
		<text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#0B2B22">bxSites migrate --from=gitbook</text>
	</g>

	<text x="80" y="580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#0B2B22" opacity="0.8">One command. Nothing silently dropped.</text>
</svg>
