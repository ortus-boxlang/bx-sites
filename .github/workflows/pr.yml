name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
    # The Java subprojects (core/, gradle-plugin/, maven-plugin/) have their
    # own CI (gradle-plugin-ci.yml, maven-plugin-ci.yml) and build/test with
    # entirely different tooling - keep the two decoupled.
    paths-ignore:
      - "core/**"
      - "gradle-plugin/**"
      - "maven-plugin/**"
  pull_request:
    branches:
      - "releases/v*"
      - development
    paths-ignore:
      - "core/**"
      - "gradle-plugin/**"
      - "maven-plugin/**"

# A branch with an open PR fires both `push` (the branch itself changed) and
# `pull_request: synchronize` (the PR's head changed) for the same commit -
# two independent runs of the same suite, wasting CI minutes and occasionally
# showing one pass and one fail for a flaky test on the exact same SHA.
# Group by branch name (normalized across both event shapes: `head_ref` is
# only set on pull_request, `ref_name` is the bare branch name on push) so
# the older of the two duplicate runs is cancelled instead of both completing.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit
