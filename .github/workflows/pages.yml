name: Publish Docs

# Builds this repository's own dogfooded docs (docs/ + bxsites.yaml at the
# repo root - see readme.md) with bx-sites itself, and publishes site/ to
# GitHub Pages - development is the only branch that deploys, straight to
# the site root, since it's this project's active branch working toward the
# 1.0.0 release (there is no `main` yet). Once development is stable enough
# to cut the real 1.0.0 release, it merges into a new `main` branch - at
# that point `main` becomes the frozen 1.0.x line and this workflow's
# trigger/deploy condition below should move from `development` to `main`,
# with `development` free to start the next version's work. The docs are
# versioned now (bxsites.yaml's own `versions.default` -
# see docs/guides/versioning.md), so a released version publishes at the
# root and the plain docs/ tree (whatever's being written toward the next
# release) publishes at /next/ instead - no separate branch-based preview
# deploy needed for that anymore.
# Each publish is itself a showcase of all ten built-in themes (the theme
# gallery) - bootstrap at the root, every other theme under theme/<name>/,
# with a switcher (docs/assets/theme-switcher.js) to jump between them from
# any page.
#
# The ten themes build as ten separate matrix jobs, each on its own runner -
# real OS-level parallelism, no shared disk/BOXLANG_HOME/working tree
# between them (this repo previously ran all ten concurrently inside one
# job via a single `buildMultiTheme.sh` script juggling `git worktree` +
# bash job control on one runner; that script still exists for local
# preview - see its own docblock - but no longer runs in CI). Each job
# uploads its own site/ as an artifact; `assemble-and-deploy` downloads all
# ten, assembles them into one site/ tree, and deploys it.
#
# Requires GitHub Pages enabled for this repository with its source set to
# "Deploy from a branch" -> gh-pages -> / (root) (Settings -> Pages -> Source).
# gh-pages is created automatically by the first successful run below.

on:
  push:
    branches:
      - development
    # Deliberately no `paths:` filter - every push to development rebuilds
    # and redeploys, full stop. A paths filter here previously left
    # bxsites.io stuck on stale/empty content more than once: a push whose
    # own files didn't match the filter (tests.yml/box.json-only changes,
    # say) skipped the deploy entirely, so a real fix landing in an
    # earlier, non-matching commit never got a retry until some later,
    # unrelated matching push happened to come along. A full ten-theme
    # rebuild is cheap enough (a few parallelized minutes) that "always
    # rebuild" is worth it for "never silently stale" - see this
    # workflow's own docblock above for what actually gets built/deployed.

  # Manual Trigger
  workflow_dispatch:

permissions:
  contents: write

# Only development ever pushes here now, but keyed by ref_name still so a
# manual workflow_dispatch run from another branch (build-only - see the
# deploy step's own `if: github.ref_name == 'development'`) never queues
# behind development's.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build [${{ matrix.theme }}] (${{ github.ref_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [bootstrap, material, tailwind, docsy, slate, docusaurus, justthedocs, vuepress, gitbook, notion]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          # `with-commandbox: true` + all four of box.json's own declared
          # `dependencies` explicitly listed (bx-esapi provides
          # encodeForHTML/encodeForJavaScript/etc. - used all over every
          # theme, not just the markdown/yaml/image pipeline) - matches
          # tests.yml's/docbox.yml's own already-working combination
          # exactly. An earlier pass on this same branch removed
          # with-commandbox as apparently-unused overhead (nothing in this
          # workflow's own steps runs a bare `box` command) without
          # realizing it was apparently the thing silently auto-installing
          # box.json's own dependencies - which is also how `modules:`
          # here ended up missing bx-esapi in the first place and nobody
          # noticed. Restored rather than re-guessing at exactly what
          # setup-boxlang does or doesn't need commandbox for.
          with-commandbox: true
          modules: bx-esapi bx-yaml bx-markdown bx-image

      - name: Register this module so `bxSites` resolves
        run: |
          # setup-boxlang points BOXLANG_HOME at ${GITHUB_WORKSPACE}/.boxlang
          # (already owned by the runner user) - that's where BoxLang actually
          # looks for modules/, not under ${HOME}.
          mkdir -p "${BOXLANG_HOME}/modules"
          ln -s "$(pwd)" "${BOXLANG_HOME}/modules/$(basename "$(pwd)")"

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Point theme-switcher.js at this build's own site root
        run: |
          # Same basePath derivation as BaseUrlResolver.bx: strip
          # scheme+host off a full URL, otherwise use the value as-is
          # (ensuring leading/trailing "/"). Always the *site's* own root,
          # not this variant's own theme/<name>/ sub-path - the switcher
          # needs to know where the gallery itself starts from, the same
          # on every one of the ten variants.
          BASE_URL="$(yq -r '.baseURL // "/"' bxsites.yaml)"
          if [[ "${BASE_URL}" =~ ^https?:// ]]; then
            ROOT_PATH="$(echo "${BASE_URL}" | sed -E 's#^https?://[^/]+##')"
            [[ -z "${ROOT_PATH}" ]] && ROOT_PATH="/"
          else
            ROOT_PATH="${BASE_URL}"
            [[ "${ROOT_PATH}" != /* ]] && ROOT_PATH="/${ROOT_PATH}"
            [[ "${ROOT_PATH}" != */ ]] && ROOT_PATH="${ROOT_PATH}/"
          fi
          sed -i "s#__BXSITES_ROOT__#${ROOT_PATH}#g" docs/assets/theme-switcher.js

      - name: Point this variant at its own theme + sub-path
        if: matrix.theme != 'bootstrap'
        run: |
          # bootstrap publishes at the site root with whatever theme.name
          # is already committed - every other variant instead builds
          # under theme/<name>/ as that theme.
          BASE_URL="$(yq -r '.baseURL // "/"' bxsites.yaml)"
          export THEME="${{ matrix.theme }}"
          export URL="${BASE_URL%/}/theme/${THEME}/"
          yq eval -i '.theme.name = strenv(THEME) | .baseURL = strenv(URL)' bxsites.yaml

      - name: Build the site
        run: boxlang bxSites build

      - name: Verify the build actually produced output
        run: |
          # `boxlang bxSites <verb>`'s own exit code doesn't reliably
          # propagate a real internal crash (ModuleConfig.bx's top-level
          # try/catch swallows it) - an empty/missing site/ here is a real
          # build failure even though the step above exited 0.
          if [[ ! -d site ]] || [[ -z "$(ls -A site 2>/dev/null)" ]]; then
            echo "::error::build for [${{ matrix.theme }}] produced no site/ output"
            exit 1
          fi

      - name: Upload this theme's site/ output
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.theme }}
          path: site
          if-no-files-found: error

  assemble-and-deploy:
    name: Assemble & Deploy (${{ github.ref_name }})
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every theme's site/ output
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble bootstrap at the root, every other theme under theme/<name>/
        run: |
          mkdir -p site/theme
          mv artifacts/site-bootstrap/* site/
          for dir in artifacts/site-*/; do
            name="$(basename "${dir}")"
            name="${name#site-}"
            [[ "${name}" == "bootstrap" ]] && continue
            mv "${dir}" "site/theme/${name}"
          done

      - name: Deploy to the site root
        if: github.ref_name == 'development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          # Writes CNAME at the true gh-pages root - keeps the custom
          # domain durable across a gh-pages wipe, rather than depending
          # solely on the one-time manual Settings -> Pages -> Custom
          # domain click having created it already.
          cname: bxsites.io
