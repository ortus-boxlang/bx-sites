name: Publish Docs

# Builds this repository's own dogfooded docs (docs/ + bxsites.yaml at the
# repo root - see readme.md) with bx-sites itself, and publishes site/ to
# GitHub Pages - main publishes to the site root (stable), development
# publishes to /development/ (latest), so both versions stay live at once.
# Each publish is itself a showcase of all ten built-in themes (the theme
# gallery) - buildMultiTheme.sh builds docs/ ten times and assembles
# bootstrap at the root plus every other theme under theme/<name>/, with a
# switcher (docs/assets/theme-switcher.js) to jump between them from any
# page.
# Requires GitHub Pages enabled for this repository with its source set to
# "Deploy from a branch" -> gh-pages -> / (root) (Settings -> Pages -> Source).
# gh-pages is created automatically by the first successful run below.

on:
  push:
    branches:
      - main
      - development
    paths:
      - "docs/**"
      - "bxsites.yaml"
      - "resources/**"
      - "models/**"
      - "bifs/**"
      - "components/**"
      - "interceptors/**"
      - "ModuleConfig.bx"
      - "buildMultiTheme.sh"
      - ".github/workflows/pages.yml"

  # Manual Trigger
  workflow_dispatch:

permissions:
  contents: write

# Each branch publishes to its own destination_dir, so main and development
# deploys never conflict - only serialize a branch against its own prior runs.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          modules: bx-markdown bx-yaml bx-image

      - name: Register this module so `bxSites` resolves
        run: |
          # setup-boxlang points BOXLANG_HOME at ${GITHUB_WORKSPACE}/.boxlang
          # (already owned by the runner user) - that's where BoxLang actually
          # looks for modules/, not under ${HOME}.
          mkdir -p "${BOXLANG_HOME}/modules"
          ln -s "$(pwd)" "${BOXLANG_HOME}/modules/$(basename "$(pwd)")"

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Point baseURL and repo.editUri at this branch's own sub-path
        if: github.ref_name != 'main'
        run: |
          # main's committed bxsites.yaml already points baseURL/editUri at
          # the site root / main branch - every other branch publishes under
          # /<branch-name>/ and edits against its own branch instead, so
          # patch a throwaway copy of the config just for this build.
          export URL="https://ortus-boxlang.github.io/bx-sites/${{ github.ref_name }}/"
          export EDIT_URI="edit/${{ github.ref_name }}/docs/"
          yq eval '.baseURL = strenv(URL) | .repo.editUri = strenv(EDIT_URI)' bxsites.yaml > bxsites.yaml.tmp
          mv bxsites.yaml.tmp bxsites.yaml

      - name: Build the site (bootstrap at the root, every other theme under theme/)
        run: ./buildMultiTheme.sh

      - name: Deploy main to the site root
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Deploy development to /development/
        if: github.ref_name == 'development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: development
          keep_files: true
