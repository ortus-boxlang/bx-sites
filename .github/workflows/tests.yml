name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

  # Manual Trigger
  workflow_dispatch:

env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK_VERSION: 21

jobs:
  tests:
    name: Tests ${{ github.event.repository.name }}
    runs-on: ${{ matrix.os }}
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        experimental: [false]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          with-commandbox: true
          modules: bx-esapi bx-yaml

      - name: Check BoxLang Version
        run: boxlang --version

      - name: Install Dev Dependencies
        run: box install id=testbox --verbose --nosave

      - name: Test Module
        run: |
          # setup-boxlang points BOXLANG_HOME at ${GITHUB_WORKSPACE}/.boxlang
          # (already owned by the runner user) - that's where BoxLang actually
          # looks for modules/, not under ${HOME}.
          mkdir -p "${BOXLANG_HOME}/modules"
          ln -s "$(pwd)" "${BOXLANG_HOME}/modules/$(basename "$(pwd)")"

      - name: Run Tests
        run: |
          # TestBox's own runner always JSON-serializes the *entire* run's
          # aggregated result memento in one call
          # (system/runners/BoxLangRunner.bx), regardless of reporter - a
          # fixed-size JVM thread stack makes that overflow once the whole
          # suite gets large enough, right after the very last spec
          # finishes and before any tests/results/*.xml gets written. This
          # repo's suite crossed that threshold once the asset-pipeline
          # PR's own new tests pushed the total past ~608. The ANTJunit
          # reporter already writes one TEST-<package>.xml file per suite
          # regardless of how many `run` invocations produce them, so
          # splitting the suite across a few invocations - each with its
          # own smaller memento to serialize - avoids the crash without
          # dropping any coverage.
          STATUS=0
          ./testbox/run --directory=tests.specs.build --reporter=ANTJunit --verbose || STATUS=1
          ./testbox/run --directory=tests.specs.cli --reporter=ANTJunit --verbose || STATUS=1
          ./testbox/run --directory=tests.specs.config --reporter=ANTJunit --verbose || STATUS=1
          ./testbox/run --bundles=tests.specs.DogfoodDocsSpec,tests.specs.ModuleConfigCliSpec --reporter=ANTJunit --verbose || STATUS=1
          exit $STATUS

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: |
            tests/results/**

      # UNCOMMENT THE FOLLOWING LINES TO ENABLE SLACK NOTIFICATIONS
      # - name: Inform Slack
      #   if: ${{ failure() && github.ref == 'refs/heads/development' }}
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_CHANNEL: coding
      #     SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
      #     SLACK_ICON_EMOJI: ":bell:"
      #     SLACK_MESSAGE: "${{ env.MODULE_ID }} Tests FAILED!  You broke the build! :("
      #     SLACK_TITLE: "${{ env.MODULE_ID }} Build Failure"
      #     SLACK_USERNAME: CI
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            artifacts/**/*.xml
