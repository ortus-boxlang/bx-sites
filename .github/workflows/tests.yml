name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

  # Manual Trigger
  workflow_dispatch:

env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK_VERSION: 21

jobs:
  tests:
    name: Tests ${{ github.event.repository.name }}
    runs-on: ${{ matrix.os }}
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        experimental: [false]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          with-commandbox: true
          modules: bx-esapi bx-yaml bx-markdown bx-image

      - name: Check BoxLang Version
        run: boxlang --version

      - name: Install Dev Dependencies
        run: box install --verbose --nosave

      - name: Test Module
        run: |
          # setup-boxlang points BOXLANG_HOME at ${GITHUB_WORKSPACE}/.boxlang
          # (already owned by the runner user) - that's where BoxLang actually
          # looks for modules/, not under ${HOME}.
          mkdir -p "${BOXLANG_HOME}/modules"
          ln -s "$(pwd)" "${BOXLANG_HOME}/modules/$(basename "$(pwd)")"

      - name: Run Tests (streamed)
        run: |
          # --stream prints each bundle/suite/spec result live as it
          # completes, instead of only the final aggregate report - kept on
          # since it's what surfaced a real compile error (an unescaped `#`
          # in a ResponsiveImageProcessor.bx string literal, masked by a
          # StackOverflowError in TestBox's own JSON serialization of the
          # resulting giant cascaded-parse-error message) that the default,
          # end-of-run-only report never showed at all.
          #
          # BoxLangRunner.bx unconditionally forces its own reporter to
          # "text" whenever --stream is set (see its own shouldStream
          # branch), discarding whatever --reporter was actually requested -
          # so this streamed run can never itself produce real JUnit XML;
          # that's what the second, non-streamed run below is for.
          ./testbox/run --verbose --stream

      - name: Run Tests (JUnit report)
        run: |
          ./testbox/run --reporter=ANTJunit --verbose
          # BoxLang's TestBox runner never sets a nonzero process exit code
          # based on spec failures - the shell step above "succeeds" even
          # when specs failed, the same silent-green gap that let a real
          # regression (a stale test assertion) ship unnoticed for a while.
          # Fail this step explicitly by summing every generated JUnit XML
          # file's own `failures`/`errors` attributes (ANTJUnitReporter.cfc's
          # own <testsuite> shape).
          failures=$(grep -ohE 'failures="[0-9]+"' tests/results/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          errors=$(grep -ohE 'errors="[0-9]+"' tests/results/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Failures: ${failures}, Errors: ${errors}"
          if [ "${failures}" -gt 0 ] || [ "${errors}" -gt 0 ]; then
            echo "::error::${failures} failing / ${errors} erroring spec(s) - see the streamed run above for exactly which ones"
            exit 1
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: |
            tests/results/**

      # UNCOMMENT THE FOLLOWING LINES TO ENABLE SLACK NOTIFICATIONS
      # - name: Inform Slack
      #   if: ${{ failure() && github.ref == 'refs/heads/development' }}
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_CHANNEL: coding
      #     SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
      #     SLACK_ICON_EMOJI: ":bell:"
      #     SLACK_MESSAGE: "${{ env.MODULE_ID }} Tests FAILED!  You broke the build! :("
      #     SLACK_TITLE: "${{ env.MODULE_ID }} Build Failure"
      #     SLACK_USERNAME: CI
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            artifacts/**/*.xml
